name: Publish RAWDOGS web apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site _site/assets

          # Publish the full phone/PWA app and its source artwork.
          cp -R pwa/. _site/
          test -s _site/assets/rawdogs_icon.png
          test -s _site/assets/camo_blue.png
          test -s _site/assets/camo_green.png
          test -s _site/assets/camo_red.png

          # Publish a desktop browser version at /desktop/ using the same verified maths/data.
          mkdir -p _site/desktop/js _site/desktop/weapons _site/desktop/assets
          cp src/desktop/index.html _site/desktop/index.html
          cp src/desktop/js/app.js _site/desktop/js/app.js
          cp src/shared/engine.js _site/desktop/js/engine.js
          cp weapons/l81.js _site/desktop/weapons/l81.js
          cp weapons/sph2.js _site/desktop/weapons/sph2.js
          cp -f _site/assets/* _site/desktop/assets/

          # Desktop source originally references the Windows ICO as its favicon.
          # Pages uses the approved RAWDOGS PNG icon instead.
          sed -i 's/rawdogs\.ico/rawdogs_icon.png/g' _site/desktop/index.html

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
