name: Publish RAWDOGS v0.9.4 Windows preview

on:
  push:
    branches: [main]
    paths:
      - 'previews/v0.9.4/base64/**'
      - 'previews/v0.9.4/SHA256SUMS.txt'
      - '.github/workflows/publish-voice-preview-v094.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    name: Reconstruct, verify and publish the original preview ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore original uploaded ZIP and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat previews/v0.9.4/base64/part-*.b64 | base64 --decode > 'dist/RAWDOGS_Voice_Controlled_Field_Calculator_v0.9.4_Clean_Walkman_WINDOWS_EXE_AND_SOURCE.zip'
          ( cd dist && sha256sum --check ../previews/v0.9.4/SHA256SUMS.txt )
          unzip -tqq 'dist/RAWDOGS_Voice_Controlled_Field_Calculator_v0.9.4_Clean_Walkman_WINDOWS_EXE_AND_SOURCE.zip'
      - name: Publish GitHub pre-release (not the latest stable release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.9.4-preview >/dev/null 2>&1; then
            gh release upload v0.9.4-preview 'dist/RAWDOGS_Voice_Controlled_Field_Calculator_v0.9.4_Clean_Walkman_WINDOWS_EXE_AND_SOURCE.zip' --clobber
            gh release edit v0.9.4-preview --prerelease --notes-file previews/v0.9.4/RELEASE_NOTES.md
          else
            gh release create v0.9.4-preview 'dist/RAWDOGS_Voice_Controlled_Field_Calculator_v0.9.4_Clean_Walkman_WINDOWS_EXE_AND_SOURCE.zip' \
              --target main \
              --prerelease \
              --title 'RAWDOGS V.C.F.C. v0.9.4 Windows Preview' \
              --notes-file previews/v0.9.4/RELEASE_NOTES.md
          fi
